<script>

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

let particles = [];

function firework() {

  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height * 0.55;

  const colors = [
    "#ff1744",
    "#00e5ff",
    "#ffea00",
    "#76ff03",
    "#d500f9",
    "#ff9100"
  ];

  const color =
    colors[Math.floor(Math.random() * colors.length)];

  for (let i = 0; i < 60; i++) {

    const angle =
      Math.random() * Math.PI * 2;

    const speed =
      Math.random() * 5 + 2;

    particles.push({

      x: x,
      y: y,

      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,

      life: 70,

      color: color

    });

  }

}

function animate() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  particles.forEach((p, i) => {

    p.x += p.vx;
    p.y += p.vy;

    p.vy += 0.05;

    p.life--;

    ctx.globalAlpha =
      p.life / 70;

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI * 2
    );

    ctx.fill();

    if (p.life <= 0) {
      particles.splice(i, 1);
    }

  });

  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);

}

setInterval(firework, 900);

animate();

</script>
