body {

  background: linear-gradient(135deg, #ffe6f0, #e6f7ff, #fff5d6);
  background-size: 300% 300%;
  animation: bgmove 10s ease infinite;

@keyframes bgmove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }

  padding: 55px 20px;

}

@keyframes title {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-6px);
  }
}

.menu {
  display: block;
  width: 90%;
  max-width: 420px;
  margin: 18px auto;
  padding: 20px;
  border: none;
  border-radius: 35px;
  background: rgba(209, 75, 122, 0.92);
  color: white;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transition: 0.3s;
}

.menu:hover {
  transform: translateY(-5px) scale(1.03);
  box-shadow: 0 12px 25px rgba(0,0,0,0.22);
}

.footer {
  margin-top: 45px;
  color: #777;
