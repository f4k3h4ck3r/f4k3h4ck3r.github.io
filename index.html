<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>အဖွားနဲ့မြေး</title>

<style>
body {
  margin: 0;
  text-align: center;
  font-family: sans-serif;
  background: linear-gradient(135deg, #ffe6f0, #fff5d6);
}

.box {
  padding: 70px 20px;
}

h1 {
  color: #d14b7a;
  font-size: 38px;
}

p {
  color: #555;
  font-size: 19px;
}

button {
  padding: 15px 28px;
  border: 0;
  border-radius: 30px;
  background: #d14b7a;
  color: white;
  font-size: 18px;
}

#videoBox {
  display: none;
  margin-top: 30px;
}

video {
  width: 95%;
  max-width: 700px;
  border-radius: 15px;
}
</style>
</head>

<body>

<div class="box">

<h1>👵 အဖွား ❤️ မြေး 👧</h1>

<p>အမှတ်တရလေးများ</p>

<button onclick="showVideo()">
အဖွားနဲ့မြေး ကြည့်ရန်
</button>

<div id="videoBox">
<video controls>
<source src="VID_20230505_182738.mp4" type="video/mp4">
</video>
</div>

</div>

<script>
function showVideo() {
  document.getElementById("videoBox").style.display = "block";
}
</script>

</body>
</html>
