<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F4K3 H4CK3R</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  text-align: center;
  font-family: sans-serif;
  background: #000;
  color: #00ff41;
}

#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.box {
  position: relative;
  z-index: 1;
  padding: 60px 15px;
}

h1 {
  color: #00ff41;
  font-size: 36px;
  text-shadow: 0 0 12px #00ff41;
}

p {
  color: #b7ffbf;
  font-size: 17px;
}

button {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 18px auto;
  padding: 17px;
  border: 1px solid #00ff41;
  border-radius: 12px;
  background: rgba(0, 20, 0, 0.88);
  color: #00ff41;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #064d16;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">
  <h1>F4K3 H4CK3R</h1>
  <p>THINK • CODE • CREATE</p>

  <button onclick="location.href='technology/'">
    ၁။ 💻 နည်းပညာ
  </button>

  <button onclick="location.href='videos/'">
    ၂။ 🎬 ဗီဒီယိုများ
  </button>

  <button onclick="location.href='articles/'">
    ၃။ 📝 စာများ
  </button>

  <button onclick="location.href='photos/'">
    ၄။ 📷 ဓာတ်ပုံများ
  </button>
</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const size = 16;
let drops = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  drops = Array(
    Math.ceil(canvas.width / size)
  ).fill(1);
}

window.addEventListener("resize", resize);
resize();

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.10)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff41";
  ctx.font = size + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const char = chars[
      Math.floor(Math.random() * chars.length)
    ];

    ctx.fillText(char, i * size, drops[i] * size);

    if (
      drops[i] * size > canvas.height &&
      Math.random() > 0.975
    ) {
      drops[i] = 0;
    }

    drops[i]++;
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
