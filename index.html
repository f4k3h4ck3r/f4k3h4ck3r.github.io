<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>f4k3 h4ck3r</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      overflow-x: hidden;
      background: #050505;
    }

    /* Animated background */
    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 30%, #182848, transparent 35%),
        radial-gradient(circle at 80% 70%, #3a0f4f, transparent 35%),
        #050505;
      animation: moveBg 8s ease-in-out infinite alternate;
    }

    @keyframes moveBg {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.2);
      }
    }

    .profile {
      padding: 60px 20px 25px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: auto;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-size: 25px;
      font-weight: bold;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 10px #ffffff;
      }

      to {
        box-shadow: 0 0 35px #7aa7ff;
      }
    }

    h1 {
      font-size: 38px;
      margin: 20px 0 8px;
    }

    .bio {
      color: #ccc;
      font-size: 17px;
    }

    .box {
      max-width: 500px;
      margin: 25px auto;
      padding: 25px;
      background: rgba(20,20,20,0.85);
      border-radius: 20px;
      border: 1px solid #444;
    }

    .button {
      display: block;
      margin: 15px 0;
      padding: 15px;
      border-radius: 30px;
      text-decoration: none;
      color: white;
      background: #222;
      border: 1px solid #555;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.05);
      background: #333;
    }

    .tiktok {
      background: #ff0050;
      border: none;
    }

    .footer {
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="profile">

    <div class="avatar">
      F4K3
    </div>

    <h1>f4k3 h4ck3r</h1>

    <p class="bio">
      Welcome to my personal website
    </p>

  </div>

  <div class="box">

    <h2>About Me</h2>

    <p>
      Welcome to my website.
      This is my personal space on the web.
    </p>

    <a class="button tiktok"
       href="#"
       target="_blank">
      TikTok
    </a>

    <a class="button"
       href="#">
      Contact Me
    </a>

  </div>

  <div class="footer">
    © 2026 f4k3 h4ck3r
  </div>

</body>
</html>
