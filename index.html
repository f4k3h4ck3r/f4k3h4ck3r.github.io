<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F4K3 H4CK3R</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  text-align: center;
  font-family: sans-serif;

  background: linear-gradient(
    135deg,
    #ffe6f0,
    #e6f7ff,
    #fff5d6,
    #e6e6ff
  );

  background-size: 400% 400%;
  animation: backgroundMove 10s ease infinite;
}

@keyframes backgroundMove {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

.box {
  padding: 60px 20px;
  max-width: 650px;
  margin: auto;
}

h1 {
  color: #d14b7a;
  font-size: 42px;
  margin-bottom: 15px;

  animation: titleMove 2s ease-in-out infinite alternate;
}

@keyframes titleMove {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-10px);
  }
}

.welcome {
  color: #666;
  font-size: 18px;
  margin-bottom: 40px;

  animation: fadeIn 2s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

button {
  display: block;
  width: 90%;
  max-width: 420px;

  margin: 20px auto;
  padding: 20px;

  border: none;
  border-radius: 40px;

  background: #d14b7a;
  color: white;

  font-size: 20px;
  cursor: pointer;

  box-shadow: 0 8px 20px rgba(0,0,0,0.18);

  animation: buttonAppear 0.8s ease both;

  transition: 0.3s;
}

button:nth-of-type(1) {
  animation-delay: 0.2s;
}

button:nth-of-type(2) {
  animation-delay: 0.4s;
}

button:nth-of-type(3) {
  animation-delay: 0.6s;
}

button:nth-of-type(4) {
  animation-delay: 0.8s;
}

@keyframes buttonAppear {
  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

button:hover {
  transform: translateY(-6px) scale(1.04);

  box-shadow:
    0 12px 30px rgba(0,0,0,0.25);
}

button:active {
  transform: scale(0.95);
}

.footer {
  margin-top: 45px;
  color: #777;
  font-size: 14px;

  animation: fadeIn 3s ease;
}

</style>
</head>

<body>

<div class="box">
<img src="cover.jpg" alt="F4K3 H4CK3R Cover"
style="width:100%; max-height:300px; object-fit:cover;">
<h1>F4K3 H4CK3R</h1>

<div class="welcome">
✨ Welcome to my website ✨
</div>

<button onclick="location.href='technology/'">
💻 ၁။ နည်းပညာ
</button>

<button onclick="location.href='videos/'">
🎬 ၂။ ဗီဒီယိုများ
</button>

<button onclick="location.href='articles/'">
📝 ၃။ စာများ
</button>

<button onclick="location.href='photos/'">
📷 ၄။ ဓာတ်ပုံများ
</button>

<div class="footer">
© 2026 F4K3 H4CK3R
</div>

</div>

</body>
</html>
